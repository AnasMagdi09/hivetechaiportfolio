<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدونة الجمال - Glamour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="blog.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <svg width="40" height="40" viewBox="0 0 100 100" fill="none">
                        <circle cx="50" cy="50" r="45" fill="url(#logoGradient)"/>
                        <path d="M35 45 L50 30 L65 45 M50 35 L50 70" stroke="white" stroke-width="4" stroke-linecap="round"/>
                        <defs>
                            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#d4a574"/>
                                <stop offset="100%" style="stop-color:#e8b4b8"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="logo-text">Glamour</span>
                </div>
                <nav class="nav">
                    <a href="index.html" class="nav-link">الرئيسية</a>
                    <a href="index.html#products" class="nav-link">المنتجات</a>
                    <a href="index.html#brands" class="nav-link">العلامات التجارية</a>
                    <a href="index.html#offers" class="nav-link">العروض</a>
                </nav>
                <div class="header-actions">
                    <button class="icon-btn cart-btn" aria-label="سلة التسوق">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span class="cart-count">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Blog Hero -->
    <section class="blog-hero">
        <div class="container">
            <a href="index.html" class="back-link" style="display: inline-flex; align-items: center; gap: 0.5rem; color: var(--primary); text-decoration: none; margin-bottom: 2rem;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                العودة للرئيسية
            </a>
            <h1>مدونة الجمال</h1>
            <p>نصائح وأسرار الجمال من خبراء التجميل</p>
        </div>
    </section>

    <!-- Category Filters -->
    <section class="blog-filters">
        <div class="filter-buttons" id="blogFilters">
            <!-- Filters will be loaded by JS -->
        </div>
    </section>

    <!-- Blog Grid -->
    <section class="blog-section">
        <div class="blog-grid" id="blogGrid">
            <!-- Blog posts will be loaded by JS -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© 2024 Glamour. جميع الحقوق محفوظة.</p>
            </div>
        </div>
    </footer>

    <script src="blog.js"></script>
</body>
</html>
