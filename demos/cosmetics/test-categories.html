<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الفئات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="padding: 50px; background: #fafafa;">
    <div class="container">
        <div class="section-header">
            <h2 class="section-title">تسوقي حسب الفئة</h2>
            <p class="section-subtitle">اختاري من مجموعة واسعة من المنتجات</p>
        </div>
        <div class="categories-grid">
            <a href="skincare.html" class="category-card-new" data-category="skincare">
                <div class="category-image-wrapper">
                    <img src="https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=800&q=80" alt="العناية بالبشرة" class="category-bg-image">
                    <div class="category-overlay-gradient"></div>
                </div>
                <span class="category-badge-tag">الأكثر مبيعاً</span>
                <div class="category-content-new">
                    <div class="category-icon-badge">
                        <svg viewBox="0 0 64 64" fill="none" width="35" height="35">
                            <rect x="20" y="10" width="24" height="44" rx="4" fill="white"/>
                            <circle cx="32" cy="20" r="3" fill="rgba(255,255,255,0.5)"/>
                        </svg>
                    </div>
                    <h3 class="category-title-new">العناية بالبشرة</h3>
                    <p class="category-count">120+ منتج</p>
                    <button class="category-view-btn">
                        <span>عرض التفاصيل</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
            </a>
            
            <a href="makeup.html" class="category-card-new" data-category="makeup">
                <div class="category-image-wrapper">
                    <img src="https://images.unsplash.com/photo-1596704017254-9b121068fb31?w=800&q=80" alt="المكياج" class="category-bg-image">
                    <div class="category-overlay-gradient"></div>
                </div>
                <span class="category-badge-tag">جديد</span>
                <div class="category-content-new">
                    <div class="category-icon-badge">
                        <svg viewBox="0 0 64 64" fill="none" width="35" height="35">
                            <path d="M25 15 L39 15 L39 50 L25 50 Z" fill="white"/>
                            <ellipse cx="32" cy="15" rx="7" ry="3" fill="rgba(255,255,255,0.5)"/>
                        </svg>
                    </div>
                    <h3 class="category-title-new">المكياج</h3>
                    <p class="category-count">200+ منتج</p>
                    <button class="category-view-btn">
                        <span>عرض التفاصيل</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
