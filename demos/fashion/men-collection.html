<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجموعة الأزياء الرجالية - FashionHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="fashion-bg">
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <svg width="45" height="45" viewBox="0 0 100 100" fill="none">
                        <circle cx="50" cy="50" r="45" fill="url(#fashionGradient)" class="logo-pulse"/>
                        <path d="M35 30 L50 20 L65 30 L65 70 L50 80 L35 70 Z" fill="white" opacity="0.3"/>
                        <path d="M45 35 L55 35 L55 65 L45 65 Z" fill="white"/>
                        <circle cx="50" cy="45" r="3" fill="#e67e22"/>
                        <defs>
                            <linearGradient id="fashionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#2c3e50"/>
                                <stop offset="50%" style="stop-color:#34495e"/>
                                <stop offset="100%" style="stop-color:#e67e22"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="logo-text">FashionHub</span>
                </div>
                <nav class="nav">
                    <a href="index.html" class="nav-link">الرئيسية</a>
                    <a href="index.html#products" class="nav-link">المنتجات</a>
                    <a href="index.html#collections" class="nav-link active">المجموعات</a>
                </nav>
                <div class="header-actions">
                    <button class="icon-btn wishlist-btn" aria-label="المفضلة">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        <span class="wishlist-count">0</span>
                    </button>
                    <button class="icon-btn cart-btn" aria-label="سلة التسوق">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span class="cart-count">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Collection Hero -->
    <section class="collection-hero">
        <div class="container">
            <div class="collection-hero-content">
                <a href="index.html" class="back-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    <span>العودة للرئيسية</span>
                </a>
                <h1 class="collection-title">مجموعة الأزياء الرجالية</h1>
                <p class="collection-subtitle">أناقة رجولية بتصاميم عصرية</p>
            </div>
        </div>
    </section>

    <!-- Products Section -->
    <section class="products collection-products">
        <div class="container">
            <div class="products-grid" id="productsGrid">
                <!-- Products will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Sidebars and Modals -->
    <div class="overlay" id="overlay"></div>
    
    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>سلة التسوق</h3>
            <button class="close-cart" id="closeCart">×</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>المجموع:</span>
                <span id="cartTotal">0 ر.س</span>
            </div>
            <button class="btn btn-primary btn-block">إتمام الشراء</button>
        </div>
    </div>

    <!-- Wishlist Sidebar -->
    <div class="wishlist-sidebar" id="wishlistSidebar">
        <div class="wishlist-header">
            <h3>المفضلة</h3>
            <button class="close-wishlist" id="closeWishlist">×</button>
        </div>
        <div class="wishlist-items" id="wishlistItems"></div>
    </div>

    <!-- Quick View Modal -->
    <div class="quick-view-modal" id="quickViewModal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <button class="close-modal" id="closeModal">×</button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="men-collection.js"></script>
</body>
</html>
